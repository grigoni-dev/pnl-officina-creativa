<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Standard</title>
<style>*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;background:#0B0B0F;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 30%,#3a2a40,#0B0B0F 70%)}
nav{position:relative;display:flex;justify-content:space-between;padding:28px 64px;font-weight:600;font-size:16px}nav ul{display:flex;gap:32px;list-style:none}
.cta{background:#FF3D6E;padding:12px 22px;border-radius:999px}
h1{position:relative;margin:200px 0 0 64px;font-size:96px;font-weight:800;line-height:.95;width:900px}
p{position:relative;margin:28px 64px;font-size:22px;opacity:.8;width:600px}
.row{position:relative;display:flex;gap:16px;margin-left:64px}.row div{background:#FF3D6E;padding:18px 30px;border-radius:999px;font-weight:700;font-size:20px}.row .g{background:rgba(255,255,255,.12)}
.cd{position:absolute;right:64px;bottom:64px;display:flex;gap:24px;font-size:56px;font-weight:800}</style></head><body><div class="bg"></div>
<nav><b>PNL Officina Creativa</b><ul><li>Eventi</li><li>Galleria</li><li>Chi siamo</li><li>Sponsor</li></ul><span class="cta">Diventa socio</span></nav>
<h1>La cultura giovane di Oderzo.</h1><p>Eventi, festival e format fatti da giovani per giovani.</p>
<div class="row"><div>Diventa socio · 5 €</div><div class="g">Scopri gli eventi</div></div>
<div class="cd"><span>12g</span><span>08h</span><span>45m</span></div></body></html>
